<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Clone</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #343541;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .chat-header {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #444654;
            border-radius: 8px;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background-color: #2d2d3a;
        }
        .user-message {
            background-color: #343541;
        }
        .bot-message {
            background-color: #444654;
        }
        .chat-form {
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: #40414f;
            color: #fff;
            font-size: 16px;
        }
        #sendButton {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #10a37f;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #sendButton:hover {
            background-color: #0d8c6d;
        }
        #errorDiv {
            color: #ff6b6b;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">ChatGPT Clone</div>
        <div class="chat-messages" id="responseDiv"></div>
        <form id="chatForm" class="chat-form">
            <input type="text" id="messageInput" placeholder="Type your message here..." required>
            <button type="submit" id="sendButton">Send</button>
        </form>
        <div id="errorDiv"></div>
    </div>
    <script src="/js/chat.js"></script>
</body>
</html>
